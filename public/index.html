<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHL Draft – Pistetilanne</title>
  <link rel="stylesheet" href="./style.css?v=11">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">NHL DRAFT</p>
      <h1>Pistetilanne</h1>
      <p id="updated" class="muted">Ladataan...</p>
    </header>

    <section class="toolbar" aria-label="Raportin suodatus">
      <label for="team-select">Joukkue</label>
      <select id="team-select">
        <option value="all">Kaikki joukkueet</option>
      </select>
    </section>


    <section class="history-section">
      <h2>Pistekehitys</h2>
      <p class="muted">Joukkueiden kumulatiiviset pisteet pelipäivittäin.</p>
      <div id="history-chart" class="history-chart"></div>
      <div id="history-legend" class="history-legend"></div>
    </section>

    <section>
      <h2>Joukkueet</h2>
      <div id="team-list" class="team-list"></div>
    </section>

    <footer>
      <span>Pisteet = maalit + syötöt</span>
    </footer>
  </main>

  <script src="./app.js?v=11"></script>
</body>
</html>
