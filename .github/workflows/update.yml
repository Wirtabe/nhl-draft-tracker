name: Update NHL stats

on:
  schedule:
    # GitHub scheduled workflows use UTC.
    # This means roughly every 30 minutes, but GitHub may delay scheduled runs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/draft.json"
      - "scripts/update_stats.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NHL stats and calculate points
        run: python scripts/update_stats.py

      - name: Commit updated report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "Update NHL stats"
          git push
