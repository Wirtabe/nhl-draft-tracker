name: Update NHL stats and deploy report

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/draft.json"
      - "data/player_overrides.json"
      - "scripts/update_stats.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nhl-stats-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update NHL points and history
        run: python scripts/update_stats.py

      - name: Show update summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("public/data.json").read_text(encoding="utf-8"))
          history = json.loads(Path("public/history.json").read_text(encoding="utf-8"))

          print("generated_at:", data.get("generated_at"))
          print("season_id:", data.get("season_id"))
          print("api_status:", data.get("api_status"))
          print("resolved_players:", data.get("resolved_players"))
          print("players_with_stats:", data.get("players_with_stats"))
          print("players_without_stats:", data.get("players_without_stats"))
          print("unresolved_players:", data.get("unresolved_players"))
          print("history_dates:", len(history.get("dates", [])))

          for team in data.get("teams", []):
              print(f'{team.get("rank")}. {team.get("name")}: {team.get("points", 0)} p')
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data.json public/history.json data/player_ids.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update NHL stats and history"
            git push origin HEAD:main
          fi

      # Important: a push made by GITHUB_TOKEN does not start another workflow.
      # Therefore Pages must be deployed in THIS SAME workflow instead of
      # relying on deploy.yml to react to the bot commit.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
